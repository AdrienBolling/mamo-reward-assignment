# Craftax-Coop: heterogeneous agents, trading, cooperation required (3 by default).
name: Craftax-Coop-Symbolic
params:
  # Wrapper episode limit (upstream: 100000). Reaching it is the "timeout" outcome.
  max_episode_steps: 10000
  # Final channel: paid once on the terminal step, death < timeout < boss.
  final_reward:
    death: -1.0
    timeout: 0.0
    boss: 10.0
