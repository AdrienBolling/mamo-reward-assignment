# Root config of `mamora-train`: PPO with credit-channel gradient forensics.
#   uv run mamora-train                                  # corridor, defaults below
#   uv run mamora-train env=craftax_ma_symbolic num_envs=512 num_steps=64 total_timesteps=5e7
#   uv run mamora-train dry_run=true
defaults:
  - env: corridor
  - algo: ppo
  - _self_

seed: 0
dry_run: false

total_timesteps: 2.0e5
num_envs: 64
num_steps: 16
# Compute the per-channel gradient geometry every N iterations (NaN otherwise).
forensics_every: 1
# Console summary every N iterations; every iteration goes to metrics.jsonl.
log_every: 10

checkpoint_dir: ${hydra:runtime.output_dir}/checkpoints

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
