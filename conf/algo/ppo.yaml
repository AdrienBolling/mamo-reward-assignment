# PPO baseline (src/mamora/algos/ppo.py, PPOConfig). Shared parameters across agents.
lr: 3.0e-4
anneal_lr: true
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
ent_coef: 0.01
vf_coef: 0.5
# Auxiliary per-channel critic (diagnostics only; stop-gradient features).
channel_vf_coef: 0.5
max_grad_norm: 0.5
update_epochs: 4
num_minibatches: 4
hidden_size: 128
num_layers: 2
activation: tanh
