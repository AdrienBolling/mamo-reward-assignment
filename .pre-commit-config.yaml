# Enforcement chain for this repo (see CLAUDE.md "Workflow rules").
#   uv run pre-commit install          # installs pre-commit + commit-msg + pre-push hooks
#   uv run pre-commit run --all-files  # what CI runs, minus pytest
# Never bypass with --no-verify.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
exclude: ^third_party/
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000] # checkpoints and datasets go through DVC, not git

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.9 # keep equal to the uv version pinned in ci.yml
    hooks:
      - id: uv-lock # fails the commit if uv.lock is out of date with pyproject.toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6 # keep equal to the ruff pin in [dependency-groups].dev
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.78 # keep equal to the ty pin in [dependency-groups].dev
    hooks:
      - id: ty
        # Whole-project check through `uv check`: use .venv and uv.lock as-is (never re-lock).
        args: [--frozen]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # `type(scope): subject`, scope mandatory. Types mirror CLAUDE.md.
        args: [--force-scope, feat, fix, docs, refactor, test, chore, ci, build, perf]

  - repo: local
    hooks:
      - id: pytest
        name: pytest (pre-push, CPU)
        entry: uv run --frozen pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
